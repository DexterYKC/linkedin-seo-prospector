<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="rg" gradientUnits="userSpaceOnUse" x1="16" y1="16" x2="112" y2="112">
      <stop offset="0%" stop-color="#4F6EF7"/>
      <stop offset="55%" stop-color="#18C9E8"/>
      <stop offset="100%" stop-color="#2DD4A0"/>
    </linearGradient>
    <linearGradient id="cg" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#5B7BF8"/>
      <stop offset="100%" stop-color="#18C9E8"/>
    </linearGradient>
    <radialGradient id="dotg" cx="38%" cy="32%" r="65%">
