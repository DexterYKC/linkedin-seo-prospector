  <path d="M 34 63 A 30 30 0 1 1 48 85" fill="none" stroke="url(#rg)" stroke-width="4.5" stroke-linecap="round" opacity="0.65"/>
  <path d="M 45 60 A 19 19 0 1 1 55 75" fill="none" stroke="url(#rg)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Glow + dot -->
  <circle cx="64" cy="58" r="11" fill="rgba(16,185,129,0.15)"/>
  <circle cx="64" cy="58" r="6" fill="url(#dotg)"/>
  <circle cx="64" cy="58" r="2.8" fill="#D1FAE5" opacity="0.9"/>
  <!-- Cursor -->
  <g transform="translate(50,71) rotate(48.2)">
